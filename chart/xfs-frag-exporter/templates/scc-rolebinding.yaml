{{- if .Values.rbac.sccBinding }}
# OpenShift only: bind the ServiceAccount to an SCC that permits hostPath.
# Equivalent to `oc adm policy add-scc-to-user <scc> -z <sa> -n <ns>`.
# Harmless (dangling) on vanilla Kubernetes, which has no SCCs — leave sccBinding
# false there.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "xfs-frag-exporter.name" . }}-scc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "xfs-frag-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.rbac.sccName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "xfs-frag-exporter.name" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
