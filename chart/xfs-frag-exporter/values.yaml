# Target namespace. hostPath requires the 'privileged' Pod Security level, so
# the chart labels the namespace accordingly when it creates it.
namespace: xfs-frag-exporter
namespaceCreate: true

image:
  repository: ghcr.io/judexzhu/xfs-frag-exporter
  tag: v0.2.0
  pullPolicy: IfNotPresent

# Collection tuning.
listenPort: 9101
hostRoot: /host
scrapeInterval: 300s # GETFSMAP walk cost scales with fragmentation

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# Least-privilege by default: GETFSMAP free-space reads need no privileged/caps.
# If a cluster's SELinux/permissions block opening host mounts, set
# privileged: true below (overrides securityContext).
privileged: false
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  # No seccompProfile set: the OpenShift hostmount-anyuid SCC forbids specifying
  # one, and CRI-O applies RuntimeDefault by default anyway. On vanilla k8s you
  # may add `seccompProfile: {type: RuntimeDefault}` here.

# OpenShift: hostPath needs an SCC that allows it. Enable to have the chart bind
# the ServiceAccount to one (no manual `oc adm policy` needed). Leave false on
# vanilla Kubernetes.
rbac:
  sccBinding: false
  sccName: hostmount-anyuid

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists # run on every node, including tainted ones

# Prometheus Operator integration (kube-prometheus / OpenShift UWM). Off by
# default — without it, scrape via the pod's prometheus.io annotations.
serviceMonitor:
  enabled: false
  interval: 300s

# Scrape via the built-in OpenShift cluster monitoring (prometheus-k8s) instead
# of UWM — the node-problem-detector pattern (KCS 7024333). Adds the
# prometheus-k8s RBAC + a NetworkPolicy and labels the namespace for
# cluster-monitoring. Implies a ServiceMonitor. OpenShift only.
clusterMonitoring:
  enabled: false

# Alert rules. Thresholds are HEURISTIC — calibrate against your fleet.
prometheusRule:
  enabled: false
  smallExtentRatio: "0.90" # PRIMARY: fraction of free extents < 64 KiB (incident nodes 0.95-0.98)
  avgExtentMinBytes: "65536" # CORROBORATING: avg free extent < 16 blocks (RHEL-82924 / EKS)
  fragRatePerDay: "1.05" # secondary/info only; rate-based, false-positive prone
  maxExtentRatio: "0.10" # MAX_EXT as a fraction of an allocation group (uses xfs_agsize_bytes metric)
