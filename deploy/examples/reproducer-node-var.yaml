# Real-world reproducer: XFS free-space fragmentation ENOSPC on node's real /var.
#
# Based on the canonical xfstests/xfs/076 pattern (Brian Foster, Red Hat, 2015).
# Punches holes GRADUALLY in rounds so the deployed exporter shows the full
# monitoring story: ratio climbs from healthy → warning → alert fires → ENOSPC.
#
# HOW (3 phases):
#   1. FILL: fallocate a large file consuming most of /var's free space
#   2. PUNCH (gradual): punch alternating holes in 10 rounds, pausing between
#      each so the exporter scrapes the climbing fragmentation ratio:
#        round 1 → ~10% small extents
#        round 5 → ~50% small extents
#        round 9 → ~90% → XFSFreeSpaceFragmented FIRES
#        round 10 → ~99% → approaching ENOSPC
#   3. CREAT: create empty files until ENOSPC — inode allocation fails
#
# The pause between rounds (ROUND_PAUSE_SEC) gives the exporter time to scrape
# and Prometheus time to evaluate the alert (default: 120s = 2 min per round,
# ~20 min total for full demo).
#
# This IS the bug (RHEL-82924). Customer field evidence:
#   node ip-10-26-86-71: 264 GB free, 652,406 extents, 97.6% < 60 KiB
#
# Configurable via env vars:
#   REGION_GB       — size of region to fragment (default: 200)
#   ROUNDS          — number of punch rounds (default: 10)
#   ROUND_PAUSE_SEC — seconds between rounds for exporter to scrape (default: 120)
#
# EDIT nodeName. Then: oc apply -f deploy/examples/reproducer-node-var.yaml
# Watch: oc logs -f xfs-var-fragmenter
# Alert: xfs_free_extents_small{node="<node>"} / xfs_free_extents{node="<node>"}
# Clean up: oc delete pod xfs-var-fragmenter -n default
---
apiVersion: v1
kind: Pod
metadata:
  name: xfs-var-fragmenter
  namespace: default
  labels: { app: xfs-var-fragmenter }
spec:
  restartPolicy: Never
  nodeName: ip-10-0-2-196.eu-west-3.compute.internal
  tolerations:
    - operator: Exists
  containers:
    - name: fragmenter
      image: golang:1.23
      env:
        - { name: REGION_GB, value: "200" }
        - { name: ROUNDS, value: "10" }
        - { name: ROUND_PAUSE_SEC, value: "120" }
        - { name: HOME, value: /tmp }
        - { name: GOCACHE, value: /tmp/.cache }
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -eu
          cat > /tmp/frag.go <<'GO'
          package main

          import (
            "fmt"
            "os"
            "strconv"
            "syscall"
            "time"
          )

          const (
            punchFlags = 0x02 | 0x01 // FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE
            chunkSize  = 32768       // 8 blocks × 4 KiB
          )

          func env(key string, fallback int) int {
            v, _ := strconv.Atoi(os.Getenv(key))
            if v == 0 { return fallback }
            return v
          }

          func main() {
            gib := env("REGION_GB", 200)
            rounds := env("ROUNDS", 10)
            pause := env("ROUND_PAUSE_SEC", 120)
            region := int64(gib) << 30

            // Total holes we'll punch (every other chunk)
            totalHoles := region / (chunkSize * 2)
            holesPerRound := totalHoles / int64(rounds)

            fmt.Println("== XFS fragmentation reproducer (gradual, for monitoring demo) ==")
            fmt.Printf("   REGION_GB=%d  ROUNDS=%d  PAUSE=%ds\n", gib, rounds, pause)
            fmt.Printf("   total holes: %d  per round: %d\n", totalHoles, holesPerRound)
            fmt.Printf("   estimated total time: ~%d minutes\n", rounds*pause/60)
            fmt.Println()

            // Phase 1: fill
            fmt.Println("== Phase 1: FILL ==")
            f, err := os.Create("/work/frag")
            if err != nil { fmt.Println("create:", err); os.Exit(1) }
            fd := int(f.Fd())

            if err := syscall.Fallocate(fd, 0, 0, region); err != nil {
              fmt.Printf("fallocate %d GiB failed: %v — lower REGION_GB\n", gib, err)
              os.Exit(1)
            }
            f.Sync()
            fmt.Printf("   filled %d GiB\n\n", gib)

            // Phase 2: gradual punch
            fmt.Println("== Phase 2: PUNCH (gradual — watch the exporter ratio climb) ==")

            // Work backwards like xfs/076
            nextOffset := region - chunkSize*2
            for round := 1; round <= rounds; round++ {
              punched := int64(0)
              target := holesPerRound
              if round == rounds {
                target = totalHoles // last round gets the remainder
              }

              for punched < target && nextOffset >= 0 {
                if err := syscall.Fallocate(fd, punchFlags, nextOffset, chunkSize); err != nil {
                  fmt.Printf("   punch failed at offset %d: %v\n", nextOffset, err)
                  break
                }
                punched++
                nextOffset -= chunkSize * 2
              }
              f.Sync()

              totalPunched := totalHoles - (nextOffset/(chunkSize*2) + 1)
              pctDone := float64(totalPunched) / float64(totalHoles) * 100

              fmt.Printf("   round %d/%d: punched %d holes this round (%.0f%% total)\n",
                round, rounds, punched, pctDone)
              fmt.Printf("   → expected small-extent ratio: ~%.0f%%\n", pctDone)
              fmt.Println("   → check: xfs_free_extents_small / xfs_free_extents")

              if round < rounds {
                fmt.Printf("   → pausing %ds for exporter scrape...\n\n", pause)
                time.Sleep(time.Duration(pause) * time.Second)
              }
            }

            fmt.Println()
            fmt.Println("== Punching complete. Exporter should show ratio > 0.90 ==")
            fmt.Println("== XFSFreeSpaceFragmented alert should be firing ==")
            fmt.Println()

            // Phase 3: creat until ENOSPC
            fmt.Println("== Phase 3: CREAT — allocate inodes until ENOSPC ==")
            os.MkdirAll("/work/inodes", 0755)
            n := 0
            for {
              path := fmt.Sprintf("/work/inodes/f_%d", n)
              ff, err := os.Create(path)
              if err != nil {
                fmt.Printf("\n!! creat() FAILED after %d files: %v\n", n, err)
                break
              }
              ff.Close()
              n++
              if n%10000 == 0 {
                fmt.Printf("  created %d files...\n", n)
              }
            }

            fmt.Println()
            fmt.Println("== ENOSPC reached — RHEL-82924 reproduced ==")
            fmt.Println("   df will still show free GiB — that's the bug")
            fmt.Println("   exporter caught it before ENOSPC (ratio > 0.90)")
            fmt.Println()
            fmt.Println("== DONE; holding for inspection ==")
            for { time.Sleep(time.Hour) }
          }
          GO
          exec go run /tmp/frag.go
      volumeMounts:
        - { name: work, mountPath: /work }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: work
      emptyDir: {}
