# XFS fragmentation alerts. See docs/adr/0001 and SPEC §5.
#
# PRIMARY SIGNAL = average free-extent size (xfs_free_extent_avg_bytes). When it
# falls below ~16 blocks (64 KiB) XFS can return ENOSPC while free space remains
# (RHEL-82924; confirmed on ROSA HCP, RFE-9762). AWS EKS alerts on the same
# quantity as XFSSmallAverageClusterSize. This is a LEVEL threshold, not a rate.
#
# The deriv()-based rate alert (XFSFragmentationRising) is kept only as a weak,
# informational secondary — rate-of-fragmentation PromQL has been observed to
# false-positive across production clusters (and needs ~26h of history), so do
# not page on it.
#
# THRESHOLDS ARE HEURISTIC DEFAULTS, NOT FLEET-CALIBRATED. Tune them:
#   - 65536 B = 16 blocks: the EKS/RHEL-82924 critical avg-free-extent size.
#   - 0.10 = MAX_EXT as a fraction of an allocation group; healthy ~0.99.
#   - agsize (1434976256 B = 350336 blks x 4096) is hardcoded as a homogeneous-
#     fleet constant. Replace with the xfs_agsize_bytes metric once FSGEOMETRY
#     collection ships (phase 1.5).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: xfs-frag-exporter
  namespace: xfs-frag-exporter
  labels:
    role: alert-rules
spec:
  groups:
    - name: xfs-frag.rules
      rules:
        # The sick-node signal: rate of fragmentation growth, per day.
        - record: node:xfs_frag_density:rate1d
          expr: deriv(xfs_frag_density_extents_per_gib[24h]) * 86400

    - name: xfs-frag.alerts
      rules:
        # PRIMARY (RHEL-82924 / EKS XFSSmallAverageClusterSize): average free
        # extent below 16 blocks (64 KiB). XFS can ENOSPC creating files while
        # free space remains. This is the reliable, field-validated signal.
        - alert: XFSSmallAverageExtent
          expr: xfs_free_extent_avg_bytes < 65536
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "XFS free space critically fragmented on {{ $labels.node }} {{ $labels.mountpoint }}"
            description: >-
              avg free extent {{ $value | printf "%.0f" }} B (< 64 KiB / 16 blocks);
              file creation may ENOSPC with free space left (RHEL-82924). Drain and
              replace the node; in-place xfs_fsr needs an unmount.

        # SECONDARY / INFO ONLY: rate of fragmentation. Rate-based PromQL
        # false-positives across clusters and needs ~26h history — do not page.
        - alert: XFSFragmentationRising
          expr: node:xfs_frag_density:rate1d > 1.05
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "XFS fragmenting fast on {{ $labels.node }} {{ $labels.mountpoint }}"
            description: >-
              frag_density rising {{ $value | printf "%.2f" }} extents/GiB/day for 2h.
              Weak signal (rate-based, false-positive prone); confirm with
              xfs_free_extent_avg_bytes.

        # APPROACHING DEAD: largest free extent collapsing vs the AG ceiling.
        - alert: XFSLowContiguity
          expr: xfs_free_extent_max_bytes / 1434976256 < 0.10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "XFS largest free extent < 10% of AG on {{ $labels.node }} {{ $labels.mountpoint }}"
            description: >-
              MAX_EXT is {{ $value | printf "%.2f" }} of agsize (healthy ~0.99);
              contiguity is collapsing.

        # AGGRAVATING FACTOR: sparse inodes off. sparse=1 does NOT make a node
        # immune to fragmentation ENOSPC (RHEL-82924 hits sparse=1 nodes too), but
        # sparse=0 lowers the bar further by requiring a full contiguous inode
        # chunk. Requires the phase-1.5 FSGEOMETRY metric; never fires until then.
        - alert: XFSSparseInodesDisabled
          expr: xfs_sparse_inodes_enabled == 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "XFS sparse inodes DISABLED on {{ $labels.node }} {{ $labels.mountpoint }}"
            description: >-
              sparse=0 makes fragmentation ENOSPC even easier to hit. Unexpected
              on RHEL9/RHCOS.

        # Collection health.
        - alert: XFSExporterStale
          expr: xfs_freesp_scrape_success == 0
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "XFS frag exporter scrape failing on {{ $labels.node }} {{ $labels.mountpoint }}"
            description: "No successful GETFSMAP walk for 30m."
