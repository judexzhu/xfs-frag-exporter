apiVersion: v1
kind: Namespace
metadata:
  name: xfs-frag-exporter
  labels:
    # hostPath volumes require the 'privileged' Pod Security level even though the
    # container itself runs unprivileged and non-root (see daemonset.yaml).
    # 'restricted' and 'baseline' both forbid hostPath.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    # OpenShift only: keep the SCC controller from reverting the label above.
    security.openshift.io/scc.podSecurityLabelSync: "false"
